<!DOCTYPE html>
<html lang="en">

<head>
    <title>Spectraforge</title>
    <meta name="color-scheme" content="dark">
    <script src="{{ url_for('static', filename='js/packages/iro.js') }}"></script>
    <script src="static/js/main.js"></script>
    <script src="static/js/translate.js"></script>
    <link rel="icon" href="static/icons/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="static/css/style.css">
    <link rel="stylesheet" href="static/css/tag_colors.css">
    <script>
        function updateBrightness(value) {
            // Update the brightness setting in the backend
            fetch('/api/settings/set_setting', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ brightness: value })
            });
        }

        function updatePerformanceMode(value) {
            // Update the performance mode setting in the backend
            fetch('/api/settings/set_setting', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ performance_mode: value })
            });
        }

        function updateLan(value){
            setLanguage(value)
        }

        function updateEnhanceColors(checked) {
            // Update the enhance colors setting in the backend
            fetch('/api/settings/set_setting', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ enhance_colors: checked })
            });
        }

        document.addEventListener('DOMContentLoaded', (event) => {
            // Set the language dropdown to the current language
            const currentLan = getLanguage();
            document.getElementById('selected_lan').value = currentLan;
        });
    </script>
</head>

<body>
    <img src="static/icons/menu.svg" id="menu_icon" onclick="toggleMenu()">
    <div id="menu_container">
        {% include 'sidebar_menu.html' %}
    </div>
    <div id="effect_header">
        <h1 lan-key="page_settings">Settings</h1>
    </div>
    <div id="effects_container">
        <div class="setting">
            <label for="brightness" lan-key="settings_brightness">Brightness:</label>
            <input type="range" id="brightness" name="brightness" min="0" max="100" value="{{ brightness }}" oninput="updateBrightness(this.value)">
        </div>
        <div class="setting">
            <label for="performance_mode" lan-key="settings_performance_mode">Performance Mode:</label>
            <select id="performance_mode" name="performance_mode" onchange="updatePerformanceMode(this.value)">
                <option value="high" {% if performance_mode == 'high' %}selected{% endif %} lan-key="settings_performance_mode_high">High</option>
                <option value="normal" {% if performance_mode == 'normal' %}selected{% endif %} lan-key="settings_performance_mode_medium">Normal</option>
                <option value="low" {% if performance_mode == 'low' %}selected{% endif %} lan-key="settings_performance_mode_low">Low</option>
            </select>
        </div>
        <div class="setting">
            <label for="selected_lan" lan-key="settings_language">Language:</label>
            <select id="selected_lan" name="selected_lan" onchange="updateLan(this.value)">
                <option value="en">English</option>
                <option value="cn">Chinese (Traditional)</option>
                <option value="no">Norwegian</option>
                <option value="😎">Emoji</option>
            </select>
        </div>
        <div class="setting">
            <label for="enhance_colors" lan-key="settings_enhance_colors">Enhance Colors (Gamma Correction):</label>
            <input type="checkbox" id="enhance_colors" name="enhance_colors" {% if enhance_colors %}checked{% endif %} onchange="updateEnhanceColors(this.checked)">
        </div>
    </div>
</body>
</html>
