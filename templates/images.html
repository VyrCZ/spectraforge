<!DOCTYPE html>
<html lang="en">
<head>
    <title>Spectraforge</title>
    <meta name="color-scheme" content="dark">
    <script src="{{ url_for('static', filename='js/packages/iro.js') }}"></script>
    <script src="static/js/main.js"></script>
    <script src="static/js/audio.js"></script>
    <link rel="icon" href="static/icons/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="static/css/style.css">
    <link rel="stylesheet" href="static/css/tag_colors.css">
</head>
<body>
    <script>
        function selectImage(imageFileName) {
            // clear other engines if needed
            clearSelection();
            fetch(`/api/display_image`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ image_file: imageFileName })
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(data => {
                console.log('Image display request successful:', data);
                //document.location.href = '/';
            })
            .catch(error => {
                console.error('There was a problem with the fetch operation:', error);
            });
        }
    </script>
    <img src="static/icons/menu.svg" id="menu_icon" onclick="toggleMenu()">
    <div id="menu_container">
        {% include 'sidebar_menu.html' %}
    </div>
    <div id="effect_header">
        <h1>Images</h1>
    </div>
    <div id="effects_container">
        {% for image_file in image_files %}
        <div class="effect_container" onclick="selectImage('{{ image_file }}')">
            <p>{{ image_file }}</p>
        </div>
        {% endfor %}
    </div>
</body>
</html>
